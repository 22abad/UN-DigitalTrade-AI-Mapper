spring.application.name=demo

# ── Database (overridden by env vars in Docker) ──
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/rdtii}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:rdtii_user}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:rdtii_password}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Server Configuration
server.port=8080

# Spring Boot Actuator
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always