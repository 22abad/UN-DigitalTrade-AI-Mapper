services:
  postgres:
    image: pgvector/pgvector:pg17
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rdtii_user -d rdtii"]
      interval: 5s
      timeout: 5s
      retries: 10
    container_name: rdtii-postgres
    environment:
      POSTGRES_DB: rdtii
      POSTGRES_USER: rdtii_user
      POSTGRES_PASSWORD: rdtii_password
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./rdtii-database/db/init.sql:/docker-entrypoint-initdb.d/init.sql

  redis:
    image: redis:7-alpine
    container_name: rdtii-redis
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data

  extract-sidecar:
    build:
      context: ./extract_sidecar
      dockerfile: Dockerfile
    container_name: rdtii-extract-sidecar
    ports:
      - "4000:4000"
    env_file:
      - .env
    environment:
      SIDECAR_ADDR: 0.0.0.0:4000
      DATABASE_URL: postgres://rdtii_user:rdtii_password@postgres:5432/rdtii
      RUST_LOG: debug
    depends_on:
      postgres:
        condition: service_healthy
    restart: on-failure

  ai-service:
    build:
      context: ./ai-service
      dockerfile: Dockerfile
    volumes:
      - ./ai-service:/app
    container_name: rdtii-ai-service
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      CORS_ALLOW_ORIGINS: http://localhost:5173,http://localhost:3000
      EXTRACT_SIDECAR_URL: http://extract-sidecar:4000
    depends_on:
      postgres:
        condition: service_healthy
      extract-sidecar:
        condition: service_started
    restart: on-failure

  frontend:
    build:
      context: ./rdtii-frontend
      dockerfile: Dockerfile
    container_name: rdtii-frontend
    ports:
      - "5173:80"
    depends_on:
      - ai-service

volumes:
  redis-data:
  postgres_data:
